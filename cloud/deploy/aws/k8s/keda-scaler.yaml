apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: aws-sqs-auth
spec:
  secretTargetRef:
  - parameter: awsAccessKeyID
    name: aws-credentials
    key: AWS_ACCESS_KEY_ID
  - parameter: awsSecretAccessKey
    name: aws-credentials
    key: AWS_SECRET_ACCESS_KEY
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-sqs-scaler
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1       
  maxReplicaCount: 10     
  pollingInterval: 10      
  cooldownPeriod:  60    
  triggers:
  - type: aws-sqs-queue
    authenticationRef:
      name: aws-sqs-auth
    metadata:
      queueURL: https://sqs.eu-central-1.amazonaws.com/235901778853/sistemi-cloud-ai-task-queue
      queueLength: "1"    
      awsRegion: "eu-central-1"
