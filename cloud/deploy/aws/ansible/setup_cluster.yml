---
- name: Install K3s on Master Node
  hosts: master
  become: yes
  tasks:
    - name: Download and install K3s server (without Traefik)
      shell: curl -sfL https://get.k3s.io | sh -s - --disable traefik
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Wait for node-token to be generated
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read node-token from master
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_b64

    - name: Store master node-token as fact
      set_fact:
        k3s_token: "{{ node_token_b64['content'] | b64decode | trim }}"

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy kubeconfig to ubuntu user
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Replace localhost IP with master node IP in kubeconfig
      replace:
        path: /home/ubuntu/.kube/config
        regexp: '127\.0\.0\.1'
        replace: "{{ ansible_host }}"

    - name: Installa NGINX Ingress Controller (DaemonSet hostNetwork)
      become_user: ubuntu
      shell: |
        curl -sO https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/baremetal/deploy.yaml
        sed -i 's/kind: Deployment/kind: DaemonSet/g' deploy.yaml
        sed -i 's/type: NodePort/type: ClusterIP/g' deploy.yaml
        sed -i '/dnsPolicy: ClusterFirst/a \      hostNetwork: true' deploy.yaml
        kubectl apply -f deploy.yaml

    - name: Installa Helm 3
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Installa KEDA via Helm
      become_user: ubuntu
      shell: |
        helm repo add kedacore https://kedacore.github.io/charts
        helm repo update
        helm upgrade --install keda kedacore/keda --namespace keda --create-namespace

    - name: Fetch kubeconfig to local machine
      fetch:
        src: /home/ubuntu/.kube/config
        dest: ../kubeconfig
        flat: yes

- name: Install K3s on Worker Nodes
  hosts: workers
  become: yes
  vars:
    master_ip: "{{ hostvars[groups['master'][0]]['private_ip'] | default(hostvars[groups['master'][0]]['ansible_host']) }}"
    master_token: "{{ hostvars[groups['master'][0]]['k3s_token'] }}"
  tasks:
    - name: Download and install K3s agent
      shell: curl -sfL https://get.k3s.io | K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ master_token }} sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service
